name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  self-test:
    # 三平台真跑：技能文档里承诺的 Windows/macOS 行为不能只靠模拟。
    # Windows 先以非阻塞方式观察（符号链接权限等环境差异），红了看日志修，
    # 全绿后再把 continue-on-error 去掉变成真门禁。
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  pack-install:
    # 包内容与安装后的 CLI 都要真验一遍：npm 的 files 写错时自检看不见，装完才发现
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pack and verify contents
        run: |
          npm pack --json > pack.json
          node -e "const p=require('./pack.json')[0];const files=new Set(p.files.map(f=>f.path));const need=['SKILL.md','sub-skills/adapt/SKILL.md','scripts/run.mjs','scripts/release-check.mjs'];const miss=need.filter(f=>!files.has(f));if(miss.length){console.error('missing',miss);process.exit(1)};console.log('pack files',files.size)"
      - name: Install and run CLI
        run: |
          npm install --prefix "$RUNNER_TEMP/pkg" ./plugin-fast-adapt-*.tgz
          "$RUNNER_TEMP/pkg/node_modules/.bin/plugin-fast-adapt" | head -3

  release-check:
    # 打 tag 时才跑发布预检：版本一致、tag 在、包内容齐、自检过（npm 发布状态由人手动核）
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/release-check.mjs --offline --skip-test
